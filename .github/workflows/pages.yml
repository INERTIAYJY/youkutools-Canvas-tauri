name: Deploy site

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'src/**'
      - 'index.html'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 只保留一次进行中的部署，不打断已经开始的那次
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # base 用相对路径，站点挂在仓库子路径还是自定义域名都不用改
      - name: Build web app for the in-page demo
        run: npx vite build --base=./ --outDir site/app --emptyOutDir

      # enablement 让 workflow 自己创建 Pages 站点，省掉手动去仓库设置里开
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
