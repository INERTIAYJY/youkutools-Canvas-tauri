name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.12 - MCP 远程 HTTP 接入'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.12 为 MCP 控制桥新增远程 HTTP 接入能力（streamable HTTP），补齐即梦 CLI 完整适配与 Seedance 2.0/2.5 多模态参考，并完成视频编辑器、节点右键菜单、项目设置等模块的国际化收尾。

            ## 🔌 MCP 远程 HTTP 接入

            - MCP 控制桥新增 streamable HTTP 远程接入，外部客户端可通过 HTTP 端点控制画布。
            - 支持 Docker 宿主别名连接，容器环境也可正常访问。
            - 修复 MCP 适配器打包，新增独立的 ai-canvas-mcp 适配器资源与构建脚本。
            - 接口地址改为固定只读，避免误编辑。

            ## 🎨 即梦（Dreamina）CLI 完整适配

            - 补齐即梦 CLI 完整适配能力，新增即梦模型目录与能力配置。
            - 完善即梦服务适配器，覆盖更多生成参数与结果解析。

            ## 🎥 Seedance 2.0/2.5 增强

            - Seedance 2.5 支持多模态参考与自适应参数。
            - Seedance 2.0 补充系列模型能力配置，显式设置图片角色。

            ## 🖥️ 界面改进

            - AI 节点弹窗支持最大化 / 还原切换。
            - 视频编辑器完全国际化，补齐过渡、字幕、媒体、时间轴、检查器、预览等面板翻译。

            ## 🌍 国际化收尾

            - 节点右键菜单、项目设置弹窗、系列面板、画布提示等补齐翻译。

            ## ⚠️ 升级与兼容性

            - MCP 远程 HTTP 接入需要 v0.8.12 或更高版本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
