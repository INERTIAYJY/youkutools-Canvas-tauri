name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.1 - 分镜表'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.1 新增分镜表节点，可在画布上按镜头编排画面并标注景别、运镜和时长，整张分镜表可一键推送到视频剪辑时间轴；同时画面格支持手动挑选候选画面或由 AI 直接生成。

            ## 🎬 分镜表节点

            - 新增分镜表节点，在画布上以表格形式编排镜头：每行一个画面格，支持添加、删除、排序和拖拽调整行高。
            - 每个画面格可标注景别、运镜、时长、角色和对白，格子内支持放置参考图片或视频帧。
            - 画面格支持「候选画面」：可手动从画布节点中挑选，也可由 AI 根据该格的文字描述直接生成新画面。
            - 整张分镜表可一键推送到视频剪辑时间轴，每个画面格转为对应时长的片段，标注信息一并带入。

            ## 🛠️ 设置优化

            - 调用助手添加按钮移到弹窗右上角，按钮沿用厂商原名，不再显示为通用「添加」。
            - 助手添加改为遍历中转站全部模型，复用已填的 Base URL，不再需要逐个手动输入。

            ## 🐛 修复

            - 修复镜头表垂直对齐与拖拽手柄尺寸，并修正右键菜单在部分场景下命中错误节点的问题。

            ## ⚠️ 升级与兼容性

            - 分镜表节点需要 v0.8.1 或更高版本才能完整识别，旧版本打开含分镜表的画布时分镜表会降级显示。
            - 推送到剪辑时间轴功能仅在桌面版可用。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
