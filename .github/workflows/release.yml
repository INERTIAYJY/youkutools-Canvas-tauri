name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.6.9 - 画布恢复与创作流程增强'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.6.9 强化项目数据保护与画布操作能力，并完善节点工具栏、视频比例和并发媒体保存流程。

            ## 🧭 画布与项目

            - 新增画布操作记录浮层，可查看当前历史位置、撤销或还原操作，并支持固定显示。
            - 修复启动时资产索引异常可能导致已保存画布被空项目覆盖的问题，并恢复上次成功打开的项目。
            - 支持画布分组与本地文件夹同步，复制节点时会保留原有入口连线。

            ## 🎛️ 节点与媒体生成

            - 新增可编辑的节点“更多”菜单和工具栏显示模式，覆盖文本、图片、视频、音频与全景节点。
            - 视频输出新增画面比例设置，ComfyUI 与自建通用模型会按比例计算实际宽高。
            - 修复并发生成结果因同名文件互相覆盖，以及图片遮罩编辑器工具栏无法点击的问题。

            ## 🔒 凭据与任务恢复

            - API Key 不再以明文写入 IndexedDB；现有凭据会在启动后自动迁移到受保护的本地凭据存储。
            - 修复 Agent 恢复任务重复入队的问题，避免同一任务被并发执行两次。

            ## ⚠️ 升级与兼容性

            - 未设置画面比例的既有 ComfyUI 视频节点将使用默认 `16:9`，不再沿用历史上的正方形输出。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
