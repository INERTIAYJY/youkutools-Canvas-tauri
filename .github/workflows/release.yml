name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.9 - 首次启动引导与中转站协议校验'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.9 新增首次启动引导与帮助中心 @ 节点演示，支持中转站模型勾选接入与协议校验，视频参数面板支持离散时长档位，规划阶段在步骤下方实时显示助手当前动作，并修复 ComfyUI 工作流节点派生与生成逻辑。

            ## 🚀 首次启动引导

            - 新增首次启动引导对话框，帮助新用户快速了解核心功能。
            - 帮助中心新增 @ 节点演示，直观展示如何通过 @ 提及引用画布节点。

            ## 🤖 中转站模型接入增强

            - 支持中转站模型勾选接入与协议校验，接入前验证协议可用性。
            - 文档授权在已授权路径下自动继承子页面，避免渲染失败导致接口页不可读。

            ## 🎥 离散时长档位

            - 视频参数面板对仅支持固定时长档位的模型渲染为按钮选择。
            - 请求时长自动吸附到最近的档位。

            ## 💬 规划阶段动作显示

            - 规划/整理阶段在步骤下方实时显示助手当前动作（如「正在分析工具结果」），带 spinner 与已用时长，不再出现空白。

            ## 🐛 修复

            - 修复 ComfyUI 工作流节点派生与生成逻辑。

            ## ⚠️ 升级与兼容性

            - 首次启动引导与中转站协议校验需要 v0.8.9 或更高版本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
