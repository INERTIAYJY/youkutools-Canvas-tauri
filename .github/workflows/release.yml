name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.3 - ComfyUI 工作流优化'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.3 聚焦 ComfyUI 工作流体验：内置工作流编辑后原地保存不再产生重复副本，内嵌窗口与保存逻辑优化，新增视频节点查看提示词功能，并提取公共轮询与上传缓存模块、补齐视频参数注入遗漏字段。

            ## 🖥️ ComfyUI 工作流优化

            - 内置工作流（`builtin-` 前缀）在 ComfyUI 中编辑并保存后原地更新，不再新建同名副本，默认输入输出节点保持不变。
            - 优化内嵌窗口行为与工作流保存链路，工作流列表布局精简，更方便查找与切换。
            - 提取公共轮询与上传缓存模块，统一任务状态跟踪与素材上传，错误提示更明确。
            - 补齐视频参数注入遗漏的字段，生成参数更完整地传入工作流。

            ## 📝 视频节点查看提示词

            - 视频节点工具栏新增「查看提示词」按钮，点击后在节点旁打开对话框显示当前提示词，方便核对与复用。

            ## 🐛 修复

            - 修复分镜表节点在部分键盘快捷键操作下误弹出 AI 对话框的问题。

            ## 📚 文档

            - 新增 ComfyUI 工作流集成说明文档。

            ## ⚠️ 升级与兼容性

            - ComfyUI 内置工作流需要 v0.8.3 或更高版本才能获得原地保存行为，旧版本在编辑内置工作流后仍可能保存为副本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
