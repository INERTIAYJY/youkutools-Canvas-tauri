name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.6 - Seedance 视频模型与资产库提及'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.6 支持 Seedance 2.0/2.5 视频生成模型及首尾帧、长时长参数约束，统一本地媒体参考解析，为通用视频模型引入能力声明以约束生成参数，并支持在 @ 提及中选择引用资产库人物/场景/道具。

            ## 🎥 Seedance 2.0/2.5 视频模型

            - 新增 Seedance 2.0/2.5 视频生成模型支持，接入统一媒体生成入口。
            - 支持通过 `image_with_roles` 数组传递首帧与尾帧，首尾帧角色化驱动画面。
            - 新增长时长参数约束，doubao-seedance-2.5 默认比例 size 调整为 adaptive。

            ## ⚙️ 通用模型视频能力声明

            - 为通用视频模型添加 videoCapability 类型声明，统一约束时长、分辨率、比例与参考素材。
            - 参数面板消费能力视图，按模型声明钳制生成参数。
            - 协议变量新增 imageWithRoles，支持按角色传递首尾帧。

            ## 💬 @ 提及引用资产库

            - 支持在 @ 提及选择器中直接搜索并引用资产库的人物、场景与道具。
            - 新增统一的 MentionPicker 组件与样式，@ 提及体验更一致。

            ## 🐛 修复

            - 修复会话按剧集归属：会话统一按 seriesOwnerId 存取，分集共用剧集会话。
            - 修复新建项目漏加载会话的问题，切换到新项目后聊天面板不再停留在上一个项目。

            ## ⚠️ 升级与兼容性

            - Seedance 2.0/2.5 模型支持需要 v0.8.6 或更高版本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
