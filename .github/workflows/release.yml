name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.10 - 多语言国际化'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.10 全面接入国际化，新增中 / 英 / 日 / 韩四语界面与语言切换，将画布、节点、对话、Agent、设置、角色库等核心模块的硬编码中文文案统一迁移到 useT 国际化方案，并新增英日韩多语言 README。

            ## 🌍 多语言支持

            - 新增界面语言切换，支持简体中文、英文、日文、韩文。
            - 新增完整的 src/i18n 翻译体系：按域拆分 common / canvas / nodes / chat / settings / project / character / onboarding 等翻译文件。
            - 提供 useT 国际化方案，统一文案调用与翻译资源管理。

            ## 🧩 组件国际化迁移

            - 画布组件（工具栏、右键菜单、径向菜单、历史时间线、多选工具栏、笔记样式面板等）全部接入国际化。
            - 节点组件（AI、图片、视频、音频、动画、文本、Markdown、分组、全景查看器等）与共享编辑器全部迁移。
            - 对话与 Agent 组件（输入框、消息列表、任务中心、时间线、审批卡片、执行依据、工具详情等）全部迁移。
            - 设置模块（API Key、ComfyUI、MCP 控制、存储健康、模型协议、子智能体、快捷键等）全部迁移。
            - 角色库、项目库、引导对话框、标题栏等界面文案同步接入。

            ## 📚 文档

            - 新增英文、日文、韩文 README，中文 README 补充多语言说明。

            ## ⚠️ 升级与兼容性

            - 多语言界面需要 v0.8.10 或更高版本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
