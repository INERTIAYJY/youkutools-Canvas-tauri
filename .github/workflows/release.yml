name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.7.0 - 内置视频剪辑器'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.7.0 新增内置视频剪辑器，支持多轨时间线、实时预览与合成导出；视频节点可一键进入独立剪辑窗口，剪辑结果以新节点形式回填画布，让画布上的视频素材可直接完成多轨编辑与导出。

            ## 🎬 内置视频剪辑器

            - 新增内置视频剪辑独立窗口，可从视频节点右键菜单或节点工具栏进入，剪辑与画布互不干扰。
            - 时间线支持多轨视频与音频叠加，片段可跨轨道拖拽，并提供轨道锁定、隐藏和静音状态闭环。
            - 预览区支持多轨视频叠加层实时预览，可随播放头同步查看合成效果。
            - 检视器支持片段裁剪、时长、音量等参数编辑；媒体面板可管理导入素材；编解码面板可选择导出编码参数。
            - 时间线提供标尺、波形和吸附刻度，便于精确定位片段与音频对齐。
            - 剪辑操作接入撤销重做历史记录，多轨交互调整可逐步回退。

            ## 📤 导出与合成

            - 剪辑导出结果改为新建视频节点，不再覆盖源节点，保留原始素材。
            - 当导出素材参数不一致时自动改走合成导出，避免编码失败。
            - 无可用音频编码器时改用音频分组直通，保证音频轨道可正常导出。

            ## 🐛 修复

            - 修复画布笔记绘制后节点无法拖拽的问题。

            ## ⚠️ 升级与兼容性

            - 视频剪辑器依赖本地编解码能力，需要 v0.7.0 或更高版本；导出编码格式取决于本机已安装的编解码器。
            - Intel Mac 版本不包含本地 ONNX Runtime，本地 ONNX 图像处理能力不可用；视频剪辑与 AI 模型功能不受影响。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
