name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.7.4 - Gemini/Grok 接入与反推提示词'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.7.4 新增 Google Gemini 与 xAI/Grok 厂商接入，支持图片和视频节点反推提示词，视频节点可手动挑选参考帧与参考角色；同时 8 向宫格动画改为纯切图+色键抠底，不再依赖本地 ONNX Runtime。

            ## 🤖 新厂商接入

            - 新增 Google Gemini 官方厂商接入，支持 Gemini 系列文本和图像模型，可使用 Gemini API Key 在设置中连接。
            - 新增 xAI/Grok 官方厂商接入，支持 Grok 系列文本模型。

            ## 🎬 视频节点增强

            - 视频节点支持手动挑选参考帧，可指定视频中任意一帧作为生图或生视频的参考输入。
            - 视频节点支持手动挑选参考角色，从视频中选取角色形象用于后续生成。
            - 视频时长控制从帧数统一为秒数，定位逻辑抽取到独立工具模块，交互更直观。

            ## 🔍 反推提示词

            - 图片节点和视频节点新增反推提示词功能，可将节点中的图像或视频帧反向解析为文本提示词，便于复用画面内容。
            - 反推结果支持一键填入节点的生成提示词区域。

            ## 🎨 动画与图像

            - 8 向宫格动画改为纯切图 + 色键抠底方案，不再依赖本地 ONNX Runtime，Intel Mac 和所有桌面平台均可使用。
            - 动画节点支持一键换皮，可替换角色外观同时保留骨骼结构和动作数据。

            ## 🛠️ 交互优化

            - Toast 报错提示支持一键复制错误内容，停留时间延长便于查看完整信息。
            - Agent 支持受控渲染动态 API 文档，可基于运行时状态生成文档内容。

            ## ⚠️ 升级与兼容性

            - 8 向宫格动画不再依赖本地 ONNX Runtime，Intel Mac 版本现在也可使用该功能。
            - Google Gemini 和 xAI/Grok 需要用户在设置中填入对应 API Key 后使用。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
