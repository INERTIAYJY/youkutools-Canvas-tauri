name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.6.13 - 角色声音与音频工作流'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.6.13 为角色库补齐声音素材管理和配音生成链路，并让厂商模型与 ComfyUI 工作流都能使用参考音频，同时完善媒体产物保存和浅色主题。

            ## 🎭 角色声音

            - 项目角色与全局角色均支持绑定多段声音、设置主声音、填写标签和台词，并统一关联本地音频文件。
            - 可从角色声音直接创建音频节点或配音生成节点，声音节点会通过连线作为音色参考，角色台词会预填到生成节点。
            - 对话 Agent 可查询角色库和声音信息，并通过受控工具更新短剧资产；只读子智能体也可读取已授权的角色声音元数据。

            ## 🎙️ 音频生成与工作流

            - 连入音频生成或视频生成节点的参考音频会进入厂商适配器，APIMart 等支持该能力的模型可直接使用。
            - ComfyUI 工作流新增音频输入识别、上传与注入，显式配置优先，未配置的音频输入会按顺序使用连线参考音频。
            - 对话生成的图片、视频和音频会明确记录是否已保存到项目；落盘失败时保留临时结果并提供“重试保存”。

            ## 📁 项目与稳定性

            - 项目创建会等待持久化成功后再关闭窗口，避免保存失败时误以为项目已经建立。
            - 优化节点与设置对话框的状态订阅，减少无关全局状态变化引起的重复渲染。
            - 移除厂商连接弹窗拖拽，避免编辑连接时误移动窗口内容。

            ## 🎨 主题与布局

            - 浅色主题改为低饱和马卡龙配色，并统一画布、节点、面板、工具栏和编辑器的明暗层级。
            - 修复资产瀑布流和角色参考图布局，减少窄窗口下的错位和多余留白。
            - 收紧设置面板纵向间距及全局容器内边距，提高信息密度并扩大有效工作区。

            ## ⚠️ 升级与兼容性

            - 角色声音字段为可选数据，现有项目和角色会保持兼容，无需手动迁移。
            - ComfyUI 内置 `LoadAudio` 和上传型音频节点可接收参考音频；读取主机绝对路径的 `VHS_LoadAudio` 变体会跳过自动注入。
            - Intel Mac 版本不包含本地 ONNX Runtime，本地 ONNX 图像处理能力不可用；其他画布与 AI 模型功能不受影响。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
