name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.6.10 - Skill 按需加载与节点交互增强'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.6.10 新增对话助手 Skill 按需加载，完善节点编辑、跨项目粘贴和全景交互，并增强视频参考媒体兼容性。

            ## 🧠 对话助手与设置

            - 对话助手可先发现 Skill 摘要，再按任务需要加载完整说明和授权资源，减少无关内容占用上下文。
            - 修复任务中心返回入口和浅色主题显示。
            - 常规设置新增“显示节点标题”开关，可隐藏画布节点上方的类型和名称。

            ## 🧩 节点与画布

            - 节点缩放把手扩展到四角和四边，并仅在悬浮节点时显示。
            - 粘贴或拖入的图片节点使用透明背景，透明图片可直接透出画布。
            - 修复跨项目粘贴可能影响源项目素材的问题。
            - 全景节点改为点击后进入视角模式，未激活时可正常拖动画布节点。

            ## 🎬 视频与接口兼容

            - 自定义视频接口可按协议变量显示时长、分辨率、画面比例和音频控制。
            - 视频节点可把连入的图片、视频和音频作为参考媒体，并提供首帧、尾帧等请求变量。
            - APIMart Seedance 2.0 系列支持参考视频和参考音频，并校验各类参考媒体数量。

            ## ⚠️ 升级与兼容性

            - Intel Mac 版本不包含本地 ONNX Runtime，本地 ONNX 图像处理能力不可用；其他画布与 AI 模型功能不受影响。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
