name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.6.14 - 画布笔记与项目迁移'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.6.14 新增画布笔记与绘图工具，并支持项目整体导入导出；同时补齐节点锁定、图片形态转换和视频参考媒体链路，让画布编辑与项目迁移更完整。

            ## ✏️ 画布笔记与绘图

            - 新增矩形、菱形、椭圆、箭头、直线、自由绘制、文本和图片八类画布笔记，可直接在画布工具栏中创建。
            - 画布笔记支持描边、填充、透明度、线型、箭头、字体、对齐和图层顺序等样式，并接入选择、撤销重做与项目持久化。
            - 图片节点和图片笔记可通过右键菜单互相转换，便于在生成工作流节点与自由排版素材之间切换。

            ## 📦 项目迁移与启动

            - 项目库支持将画布、项目设置、短剧资产、本地素材、对话记录和项目记忆整体导出为 `.aicanvas` 项目包，并从项目包导入为独立项目。
            - 导入项目会使用新的项目标识并重建对话与记忆关联，避免覆盖当前设备上的同名项目。
            - 设置中新增启动视图选项，可选择启动后打开上次项目或直接进入项目列表；新建项目时同步显示保存进度和失败反馈。

            ## 🧭 画布操作

            - 节点右键菜单新增锁定与解锁，锁定后可避免误拖动节点。
            - 图片粘贴和拖入画布时恢复以节点背景方式展示，保持与图片节点编辑能力一致。
            - 优化画布、图片节点、设置面板和提及编辑器的职责拆分，减少复杂界面交互时的无关更新。

            ## 🎬 媒体引用

            - 视频生成补齐视频到视频操作语义，并可将提示词中引用的视频和音频节点拆分为独立参考媒体参数。
            - 图片、视频和音频三类连线参考媒体统一进入厂商适配层，由所选模型支持的能力决定实际请求内容。
            - 优化异步生成任务的结果解析，恢复中的任务与新提交任务使用一致的媒体结果识别逻辑。

            ## ⚠️ 升级与兼容性

            - 现有项目无需手动迁移；新建的画布笔记需要 v0.6.14 或更高版本才能完整识别。
            - 项目整体导入导出仅在桌面版可用；项目包最多为每个对话保存 100,000 条消息，未落入项目数据目录的外部素材可能无法随包迁移。
            - 参考媒体能否生效取决于所选模型和厂商适配器的实际支持能力。
            - Intel Mac 版本不包含本地 ONNX Runtime，本地 ONNX 图像处理能力不可用；其他画布与 AI 模型功能不受影响。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
