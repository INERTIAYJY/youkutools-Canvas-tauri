name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.7.3 - 转场系统与 ComfyUI 应用内窗口'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.7.3 在视频剪辑器中引入转场系统，支持预览内同步显示转场效果和 AI 生成转场片段；同时新增应用内 ComfyUI 窗口与工作流编辑能力，并增强 MCP 控制桥的端口固定、多客户端连接和自动开启特性。

            ## 🎬 视频剪辑转场

            - 视频剪辑器新增转场系统，预览区可同步显示转场效果，不必导出才能看到最终画面。
            - 贴图与文字合并到统一的素材面板，转场独立为时间线专用标签页。
            - 转场面板支持 AI 生成转场片段，生成的转场片段时长自动探测回填。
            - 修复交叠淡入转场退化为黑场的问题，淡入时正确补上前一段底画面。
            - 修复剪辑预览播到片段交界处停住的问题。

            ## 🖥️ 应用内 ComfyUI

            - 新增应用内 ComfyUI 窗口，可在独立窗口中加载 ComfyUI 界面并进行工作流编辑与保存。
            - 修复 ComfyUI 生成音频时只认复数 `audios` 键、漏掉单数 `audio` 键导致误报未返回媒体的问题。

            ## 🔌 MCP 增强

            - MCP 控制桥支持固定端口，不再每次随机分配，便于外部客户端稳定连接。
            - 支持多客户端同时连接，无需断开已有连接即可接入新客户端。
            - 新增 MCP 桥自动开启选项，可在设置中配置应用启动时自动开启 MCP 服务。

            ## 🛡️ 稳定性

            - 新增节点级错误边界，当单个节点渲染异常时降级为占位提示卡，不再导致整页白屏。

            ## ⚠️ 升级与兼容性

            - 应用内 ComfyUI 窗口需要本机已安装并运行 ComfyUI 服务，仅桌面版可用。
            - MCP 控制桥仅在桌面版可用，固定端口功能需要 v0.7.3 或更高版本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - Intel Mac 版本不包含本地 ONNX Runtime，本地 ONNX 图像处理能力不可用；视频剪辑与 AI 模型功能不受影响。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
