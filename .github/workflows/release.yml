name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.7.1 - 视频剪辑与创作控制升级'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.7.1 重点完善视频剪辑工作流，新增文字、贴图、本机字体、画面直接变换和本地导出，并强化时间轴与素材管理；同时为图片和视频生成节点增加可视化摄影参数控制。

            ## 🎬 视频剪辑工作流

            - 新增文字与贴图编辑，可上传本机图片或选择画布图片节点，并支持读取本机字体及按真实字体样式预览选择。
            - 主视频和叠加层支持在预览画布中直接移动、等比缩放和旋转，预览与导出共用位置、缩放、旋转和透明度计算。
            - 时间轴新增滚轮缩放、横向平移、框选、吸附指示和三档轨道高度，并优化文字轨道层级与紧凑高度。
            - 素材面板新增分类筛选、搜索，以及从素材库、本机和画布图片节点导入；素材可拖入时间轴调整位置与层级。
            - 预览区新增适应窗口、25%、50%、100% 缩放、可编辑时间码、全屏预览和快捷键速查。
            - 属性面板按片段、画面、音频和工程重新分组，同时保留独立的文字与贴图入口。

            ## 📤 导出与媒体质量

            - 新增导出到本地，可通过系统保存窗口直接写出 MP4；原有导出为画布新节点方式继续保留。
            - 提升时间轴视频缩略图的抽帧分辨率与编码质量，并按当前缩放动态铺帧，减少竖屏视频轨道模糊。
            - 修复多片段拼接导出丢失音轨的问题；无可用 AudioEncoder 时可回退到 PCM 混流，避免静默丢弃音频。

            ## 📷 生成与画布控制

            - 图片和视频生成节点新增焦距、快门效果、光圈和曝光时间设置，并提供摄影效果预览。
            - 画布曲线箭头新增曲率拖拽手柄，可直接调整弯曲方向和幅度。

            ## ⚠️ 升级与兼容性

            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - Intel Mac 版本不包含本地 ONNX Runtime，本地 ONNX 图像处理能力不可用；视频剪辑与 AI 模型功能不受影响。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、本机字体读取和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
