name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.7.2 - 视频截帧与撤销可靠性'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.7.2 把视频截帧做成完整能力：节点可一键取首帧、当前帧或尾帧，剪辑窗口可把播放头所在的合成画面直接导出为画布图片节点；同时修复了删除节点后撤销会丢失媒体文件的问题。

            ## 🎬 视频截帧

            - 视频节点的截帧按钮改为菜单，可选导出首帧、当前帧或尾帧，取帧后预览位置自动复位。
            - 视频剪辑窗口新增「导出当前帧」，按导出同一条合成路径渲染播放头那一帧（含叠加轨、文字与贴图），保存为 PNG 并在源节点旁生成图片节点。

            ## 🛠️ 修复

            - 修复删除节点后撤销，视频、图片等媒体文件不回来的问题：文件暂存失败时不再转入系统回收站，撤销也不会抢在文件暂存前面执行；确实未能还原时会明确提示，不再只表现为节点打不开。
            - 修复以图生成时引用图片失效导致生成失败的问题：复用已上传的图床地址前先确认其仍可访问，并收紧上传缓存有效期。

            ## 🔒 画布

            - 节点锁定后不仅位置固定，也不能再拖拽缩放，分组节点同样适用。

            ## ⚠️ 升级与兼容性

            - 剪辑窗口的「导出当前帧」依赖本机解码能力，导出的 PNG 写入当前项目数据目录，仅桌面版可用。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - Intel Mac 版本不包含本地 ONNX Runtime，本地 ONNX 图像处理能力不可用；视频剪辑与 AI 模型功能不受影响。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、本机字体读取和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
