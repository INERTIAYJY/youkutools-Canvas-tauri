name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.7 - 媒体模型能力表与参数映射'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.7 新增通用媒体模型能力表，统一管理图片/音频模型能力并约束生成参数；抽取媒体参数映射模块，统一图片/音频/视频的请求体构造；更新 Seedream 模型 ID 并兼容旧 ID 别名，并为自定义 OpenAI 中转站添加使用提示。

            ## 🗂️ 通用媒体模型能力表

            - 新增 mediaModelCapabilities，统一管理图片与音频模型能力。
            - 按能力表约束生图分辨率、批量数量与参考图，参数更贴合模型实际能力。
            - 更新 Seedream 模型 ID 并兼容旧 ID 别名，支持 Seedance image_with_roles 参考图角色。

            ## 🔧 媒体参数映射模块

            - 抽取图片、音频、视频参数映射模块，统一三类媒体的请求体构造逻辑。
            - 收敛各厂商 adapter 中散落的参数组装，减少重复代码。

            ## ⚙️ 设置改进

            - 为自定义 OpenAI 中转站添加使用提示，接入时更清晰。

            ## 📚 文档

            - 为多个源码文件补充中文模块头注释，提升可读性。

            ## ⚠️ 升级与兼容性

            - 媒体模型能力表需要 v0.8.7 或更高版本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
